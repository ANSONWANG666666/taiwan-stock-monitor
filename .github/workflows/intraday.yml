name: 台股盤中監控

# 開盤前觸發一次，同一個執行持續到收盤後：
#   09:00–13:35 每 5 分鐘大單監控；09:00–13:30 每 20 秒盤中即時監控（型態觀察名單）
#   09:30／13:00／13:50 盤中選股；13:20 黑飛舞 Day 2 出場提醒
# 主要由 cron-job.org 在 08:50 準時觸發（見 docs/外部排程設定.md）；
# 下面的 GitHub 排程只是備援，GitHub 常延遲或跳過，時間刻意避開整點。
# 同一時間只會有一個在跑；後到的會排隊，等前一個結束後發現已過 14:10 就直接結束。
on:
  workflow_dispatch:
  schedule:
    - cron: '47 0 * * 1-5'   # 08:47
    - cron: '13 1 * * 1-5'   # 09:13
    - cron: '43 2 * * 1-5'   # 10:43
    - cron: '13 4 * * 1-5'   # 12:13

concurrency:
  group: intraday
  cancel-in-progress: false

permissions:
  contents: write   # 寫入 journal 分支

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: Checkout 觀察名單（data 分支，只讀 state/candidates.json）
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: data-store
          sparse-checkout: state

      - name: Checkout 訊號紀錄簿（journal 分支）
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: journal
          path: journal-data

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 讀取盤中狀態快取
        uses: actions/cache@v4
        with:
          path: |
            stock_state.json
            screener_kline_cache.json
            screener_status.json
            jev_news_cache.json
            jev_budget.json
          key: intraday-${{ github.run_id }}
          restore-keys: |
            intraday-

      - name: 盤中監控（持續到收盤後）
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TYPESAFE_API_KEY:   ${{ secrets.TYPESAFE_API_KEY }}
          JEV_DAILY_LIMIT:    '200'          # 大單監控＋盤中選股合計
          JOURNAL_DIR:        journal-data
          LARGE_BID_THRESHOLD: '1000'
          VOLUME_SPIKE_RATIO:  '3.0'
          VOLUME_SPIKE_MIN:    '200'
          PYTHONUNBUFFERED:   '1'
          CANDIDATES_FILE:    data-store/state/candidates.json
          RT_EVERY_SEC:       '20'
        run: python intraday_loop.py

      - name: 儲存訊號紀錄
        if: always()
        run: |
          [ -d journal-data/.git ] || exit 0
          cd journal-data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "訊號紀錄 $(TZ=Asia/Taipei date '+%F %H:%M') ${{ github.workflow }}"
          for i in 1 2 3; do
            git pull -q --rebase origin journal && git push -q origin HEAD:journal && exit 0
            sleep $((i * 5))
          done
          echo "::warning::訊號紀錄推送失敗"
