name: 台股全市場掃描

on:
  schedule:
    # 主要由 cron-job.org 在 15:10 觸發；以下為備援（GitHub 常延遲），同一天已推播過會自動跳過
    - cron: '17 7 * * 1-5'    # 15:17
    - cron: '47 8 * * 1-5'    # 16:47
    - cron: '17 10 * * 1-5'   # 18:17
    - cron: '17 12 * * 1-5'   # 20:17
  workflow_dispatch:
    inputs:
      scan_date:
        description: '掃描日期 YYYYMMDD（留空為今天）'
        required: false
        default: ''
      force:
        description: '同一天已推播過仍重新推播（填 1）'
        required: false
        default: ''

concurrency:
  group: market-scan
  cancel-in-progress: false

permissions:
  contents: write   # 寫入 journal 分支

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: Checkout 歷史資料（data 分支）
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: data-store

      - name: Checkout 訊號紀錄簿（journal 分支）
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: journal
          path: journal-data

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 讀取全市場日K快取
        uses: actions/cache@v4
        with:
          path: |
            market_cache.json
            market_scan_state.json
            jev_news_cache.json
            jev_budget.json
          key: market-scan-${{ github.run_id }}
          restore-keys: |
            market-scan-

      - name: 執行全市場掃描
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TYPESAFE_API_KEY:   ${{ secrets.TYPESAFE_API_KEY }}
          JEV_DAILY_LIMIT:    '100'
          JOURNAL_DIR:        journal-data
          SCAN_DATE:          ${{ github.event.inputs.scan_date }}
          FORCE_SCAN:         ${{ github.event.inputs.force }}
          MAX_DETAIL:         '10'
        run: python market_scan.py

      - name: 更新歷史日K
        if: always()
        continue-on-error: true
        env:
          DATA_DIR: data-store
          AUTO_COMMIT: '1'
          SCAN_DATE: ${{ github.event.inputs.scan_date }}
        run: |
          [ -d data-store/.git ] || { echo "尚未建立 data 分支，略過"; exit 0; }
          python history.py update ${SCAN_DATE:+--date $SCAN_DATE}

      - name: 型態選股（穿二／黑飛舞／三角收斂）
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_DIR: data-store
          AUTO_COMMIT: '1'
          CANDIDATES_FILE: data-store/state/candidates.json
          LEADER_FILE: data-store/state/leaders.json
          JOURNAL_DIR: journal-data
          SCAN_DATE: ${{ github.event.inputs.scan_date }}
        run: |
          [ -n "$(ls data-store/ohlc/*.csv.gz 2>/dev/null)" ] || { echo "尚未回補歷史資料，略過"; exit 0; }
          mkdir -p data-store/state
          python screener.py

      - name: 出場檢查（holdings.yaml）
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_DIR: data-store
          AUTO_COMMIT: '1'
          EXIT_STATE_FILE: data-store/state/exits_state.json
          SCAN_DATE: ${{ github.event.inputs.scan_date }}
        run: |
          [ -n "$(ls data-store/ohlc/*.csv.gz 2>/dev/null)" ] || { echo "尚未回補歷史資料，略過"; exit 0; }
          mkdir -p data-store/state
          python exit_manager.py
      # 訊號紀錄簿存在 journal 分支；失敗會重試，不影響推播
      - name: 儲存訊號紀錄
        if: always()
        run: |
          [ -d journal-data/.git ] || exit 0
          cd journal-data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "訊號紀錄 $(TZ=Asia/Taipei date '+%F %H:%M') ${{ github.workflow }}"
          for i in 1 2 3; do
            git pull -q --rebase origin journal && git push -q origin HEAD:journal && exit 0
            sleep $((i * 5))
          done
          echo "::warning::訊號紀錄推送失敗"

