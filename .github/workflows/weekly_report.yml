name: 台股訊號成效週報

on:
  schedule:
    # 主要由 cron-job.org 在週五 17:10 觸發；以下為備援，同一週已推播過會自動跳過
    - cron: '17 9 * * 5'     # 17:17
    - cron: '47 11 * * 5'    # 19:47
  workflow_dispatch:
    inputs:
      force:
        description: '今天已推播過仍重新推播（填 1）'
        required: false
        default: ''

concurrency:
  group: weekly-report
  cancel-in-progress: false

permissions:
  contents: write   # 已推播紀錄寫回 data 分支 state/weekly_state.json

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: Checkout 訊號紀錄簿（journal 分支）
        uses: actions/checkout@v4
        with:
          ref: journal
          path: journal-data

      - name: Checkout 歷史資料（data 分支，觀察名單覆盤用）
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: data-store

      - name: 讀取週報狀態
        uses: actions/cache@v4
        with:
          path: |
            weekly_state.json
            watch_review_state.json
          key: weekly-${{ github.run_id }}
          restore-keys: |
            weekly-

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 產生並推播週報
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          JOURNAL_DIR:        journal-data
          FORCE_REPORT:       ${{ github.event.inputs.force }}
          WEEKLY_STATE_FILE:  data-store/state/weekly_state.json
          DATA_DIR:           data-store
          AUTO_COMMIT:        '1'
        run: python weekly_report.py

      # watchlist.yaml 沒有觀察標的時自動略過；同一週只推一次
      - name: 觀察名單每週覆盤
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          FINMIND_TOKEN:      ${{ secrets.FINMIND_TOKEN }}
          JOURNAL_DIR:        journal-data
          DATA_DIR:           data-store
          WATCH_STATE_DIR:    data-store/state
          FORCE_REPORT:       ${{ github.event.inputs.force }}
        run: python watch_review.py
