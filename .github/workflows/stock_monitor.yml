name: 台股大單監控

# 大單監控已併入「台股盤中監控」（intraday.yml），這裡只保留手動執行
on:
  workflow_dispatch:   # 允許手動觸發（測試用）

# 上一輪還沒跑完時，不要同時跑兩輪（避免狀態檔互相覆蓋）
concurrency:
  group: stock-monitor
  cancel-in-progress: false

permissions:
  contents: write   # 寫入 journal 分支

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: Checkout 訊號紀錄簿（journal 分支）
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: journal
          path: journal-data

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 讀取上次狀態快取
        uses: actions/cache@v4
        with:
          path: |
            stock_state.json
            jev_news_cache.json
            jev_budget.json
          key: stock-state-${{ github.run_id }}
          restore-keys: |
            stock-state-

      - name: 執行大單偵測
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TYPESAFE_API_KEY:   ${{ secrets.TYPESAFE_API_KEY }}
          JEV_DAILY_LIMIT:    '150'
          JOURNAL_DIR:        journal-data   # 未設定時不做新聞查證
          LARGE_BID_THRESHOLD: '1000'
          VOLUME_SPIKE_RATIO:  '3.0'
          VOLUME_SPIKE_MIN:    '200'
        run: python stock_check_once.py
      # 訊號紀錄簿存在 journal 分支；失敗會重試，不影響推播
      - name: 儲存訊號紀錄
        if: always()
        run: |
          [ -d journal-data/.git ] || exit 0
          cd journal-data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "訊號紀錄 $(TZ=Asia/Taipei date '+%F %H:%M') ${{ github.workflow }}"
          for i in 1 2 3; do
            git pull -q --rebase origin journal && git push -q origin HEAD:journal && exit 0
            sleep $((i * 5))
          done
          echo "::warning::訊號紀錄推送失敗"

