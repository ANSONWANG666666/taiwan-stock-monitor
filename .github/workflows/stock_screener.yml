name: 台股四訊號選股

# 盤中選股已併入「台股盤中監控」（intraday.yml），這裡只保留手動執行與 test_symbol 測試
on:
  workflow_dispatch:   # 允許手動觸發（測試用）
    inputs:
      slot:
        description: '指定時段（0930 / 1300 / 1400），留空則依台灣時間自動判斷'
        required: false
        default: ''
      test_symbol:
        description: '測試用：填股票代號（例如 2330）會強制推播這一檔並實際呼叫 Jev，不影響正式推播紀錄；留空為正常執行'
        required: false
        default: ''

concurrency:
  group: stock-screener
  cancel-in-progress: false

permissions:
  contents: write   # 寫入 journal 分支

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: Checkout 訊號紀錄簿（journal 分支）
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: journal
          path: journal-data

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝套件
        run: pip install -r requirements.txt

      # 原本沒有保存快取，每次執行都從零開始 → 永遠資料不足
      - name: 讀取日K快取與推播狀態
        uses: actions/cache@v4
        with:
          path: |
            screener_kline_cache.json
            screener_status.json
            jev_news_cache.json
            jev_budget.json
          key: screener-state-${{ github.run_id }}
          restore-keys: |
            screener-state-

      - name: 執行四訊號選股
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TYPESAFE_API_KEY:   ${{ secrets.TYPESAFE_API_KEY }}
          JEV_DAILY_LIMIT:    '50'
          JOURNAL_DIR:        journal-data   # 未設定時不做新聞查證
          SCREENER_SLOT:      ${{ github.event.inputs.slot }}
          TEST_SYMBOL:        ${{ github.event.inputs.test_symbol }}
        run: python stock_screener.py
      # 訊號紀錄簿存在 journal 分支；失敗會重試，不影響推播
      - name: 儲存訊號紀錄
        if: always()
        run: |
          [ -d journal-data/.git ] || exit 0
          cd journal-data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "訊號紀錄 $(TZ=Asia/Taipei date '+%F %H:%M') ${{ github.workflow }}"
          for i in 1 2 3; do
            git pull -q --rebase origin journal && git push -q origin HEAD:journal && exit 0
            sleep $((i * 5))
          done
          echo "::warning::訊號紀錄推送失敗"

